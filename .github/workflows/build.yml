name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'
        validate-wrappers: false

    - name: Build Mod
      run: |
        echo "🔍 جاري البحث عن مجلد المشروع..."
        
        # البحث عن ملف build.gradle في أي مكان (حتى لو داخل مجلدات)
        GRADLE_FILE=$(find . -name "build.gradle" | head -n 1)
        
        if [ -z "$GRADLE_FILE" ]; then
          echo "❌ خطأ: لم يتم العثور على build.gradle في مستودعك."
          echo "الملفات الموجودة حالياً:"
          ls -la
          exit 1
        fi
        
        # استخراج مسار المجلد (طريقة آمنة لا تسبب خطأ dirname)
        PROJECT_DIR=$(echo "$GRADLE_FILE" | xargs -I{} dirname {})
        echo "✅ تم العثور على المشروع في: $PROJECT_DIR"
        
        # الدخول للمجلد وبناء المود
        cd "$PROJECT_DIR"
        gradle build --no-daemon

    - name: Upload Mod JAR
      uses: actions/upload-artifact@v4
      with:
        name: fabric-mod-jar
        # البحث عن ملف الجار في أي مكان
        path: '**/build/libs/*.jar'
        if-no-files-found: error
