name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip and Move Files
        run: |
          unzip Elp.zip
          # البحث عن ملف gradlew ونقل كل المحتويات إلى المجلد الرئيسي
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" -type f)
          TARGET_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project at: $TARGET_DIR"
          if [ "$TARGET_DIR" != "." ]; then
            cp -r $TARGET_DIR/* .
          fi
          ls -la

      - name: Build Mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elementpowers-jar
          path: '**/build/libs/*.jar'
