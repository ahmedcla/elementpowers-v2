name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10' # استخدمنا إصداراً مستقراً ومتوافقاً مع ماينكرافت
        validate-wrappers: false

    # هذه الخطوة ستبحث عن مكان build.gradle وتدخل إليه تلقائياً
    - name: Find Project and Build
      run: |
        # البحث عن ملف build.gradle في أي مجلد
        PROJECT_DIR=$(find . -name "build.gradle" -not -path "*/\.*" | head -n 1 | xargs dirname)
        
        if [ -z "$PROJECT_DIR" ]; then
          echo "❌ خطأ: لم يتم العثور على ملف build.gradle في المستودع!"
          echo "تأكد من رفع ملفات المشروع."
          exit 1
        fi
        
        echo "✅ تم العثور على المشروع في المجلد: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        echo "جاري بناء المود..."
        gradle build --no-daemon

    - name: Upload Mod JAR
      uses: actions/upload-artifact@v4
      with:
        name: fabric-mod-jar
        # البحث عن ملف الـ jar في أي مكان داخل مجلد build
        path: '**/build/libs/*.jar'
        if-no-files-found: error
